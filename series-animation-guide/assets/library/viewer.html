<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(/fonts/anton-latin-400-normal.woff2)}
html,body{margin:0;background:#222;overflow:hidden}
#c{display:block}
#label{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font:700 20px Inter,sans-serif;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));text-shadow:0 1px 3px #000}
#label small{display:block;font:500 13px Inter,sans-serif;opacity:.85}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas><div id="label"></div>
<script type="module">
import * as THREE from 'three';
import { makeRenderer, makeStage, makeCamera, lookFrom, aimKey } from './stage.js';
import { ITEMS } from './registry.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 640, H = +q.get('h') || 800;
const canvas = document.getElementById('c');
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
const renderer = makeRenderer(canvas, W, H);
await document.fonts.load('40px Anton'); await document.fonts.load('800 40px Inter');
window.ITEM_IDS = ITEMS.map(i => i.id);
window.showItem = async (id, tt = 0.6) => {
  const item = ITEMS.find(i => i.id === id);
  if (!item) throw new Error('no item ' + id);
  const stage = makeStage(item.stage || {});
  const cam = makeCamera(W, H, 38);
  const res = item.build({ THREE, stage, tt }) || {};
  const obj = res.obj || res;
  if (obj && obj.isObject3D) stage.scene.add(obj);
  const c = res.cam || item.cam || { pos: [0, 1.2, 4.5], target: [0, 0.9, 0], fov: 38 };
  lookFrom(cam, c.pos, c.target, c.fov);
  aimKey(stage, new THREE.Vector3(...(c.target)), 9);
  if (res.update) res.update(tt);
  renderer.render(stage.scene, cam);
  document.getElementById('label').innerHTML = `${item.title || item.id}<small>${item.cat} · ${item.id}${item.note ? ' · ' + item.note : ''}</small>`;
  return true;
};
window.READY = true;
</script></body></html>
